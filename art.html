<main>
  <section class="art-section">
    <h1>Art Gallery</h1>
    <p class="art-intro">
      A collection of my traditional drawings and paintings.
      Select an artwork to explore it in greater detail.
    </p>

    <div class="art-gallery">

      <button class="art-card" type="button"
        data-title="Fabric Drapery Study"
        data-course="ARTT 210 | Intermediate Drawing"
        data-image="imgs/fabric-drapery.jpeg">
        <img src="imgs/fabric-drapery.jpeg"
          alt="Charcoal fabric drapery study">
        <span>Fabric Drapery Study</span>
      </button>

      <button class="art-card" type="button"
        data-title="Still-Life Drawing"
        data-course="ARTT 210 | Intermediate Drawing"
        data-image="imgs/still-life.jpeg">
        <img src="imgs/still-life.jpeg"
          alt="Traditional charcoal still-life drawing">
        <span>Still-Life Drawing</span>
      </button>

      <button class="art-card" type="button"
        data-title="Bridge Landscape"
        data-course="ARTT 210 | Intermediate Drawing"
        data-image="imgs/bridge-landscape.jpg">
        <img src="imgs/bridge-landscape.jpg"
          alt="Charcoal landscape drawing featuring a bridge">
        <span>Bridge Landscape</span>
      </button>

      <button class="art-card" type="button"
        data-title="Anime-Inspired Painting"
        data-course="ARTT 320"
        data-image="imgs/anime-inspired.jpg">
        <img src="imgs/anime-inspired.jpg"
          alt="Anime-inspired acrylic painting">
        <span>Anime-Inspired Painting</span>
      </button>

    </div>
  </section>
</main>

<dialog id="art-lightbox" aria-labelledby="lightbox-title">

    aria-label="Close artwork viewer">×</button>

  <img id="lightbox-image" src="" alt="">
  <h2 id="lightbox-title"></h2>
  <p id="lightbox-course"></p>
  <p id="lightbox-description"></p>

  <div class="lightbox-controls">
    <button id="previous-art" type="button">Previous</button>
    <button id="next-art" type="button">Next</button>
  </div>
</dialog>
